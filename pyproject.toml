# ---------------------------------------------------------------------------
# Vercel configuration
#
# Vercel's Python runtime needs to know which file holds the WSGI application.
# `app.py` at the project root is already on the list of names Vercel accepts,
# but stating it explicitly removes any ambiguity (it is also the file used by
# `vercel.json` and by any other WSGI server).
# ---------------------------------------------------------------------------
[tool.vercel]
entrypoint = "app.py"
